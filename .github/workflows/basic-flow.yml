name: Java Spring boot CI (Basic)
on:
  push:
#    Lắng nghe khi code đc push lên 2 nhánh này thí sẽ kích hoạt các jobs bên dưới
    branches: ["master","main"]
  pull_request:
#    Merge code vào nhánh khác
    branches: ["master","main"]

# Các cng việc cần thực hiện
jobs:
  build-and-test:
    name: "Xây dựng và kiểm thử"
    runs-on: ubuntu-latest
    # Các bước để chạy job này
