name: Java Spring Boot CI (Basic)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

# ===================================================
# Workflow đơn giản nhất - dùng giảng dạy Session 07
# ===================================================
jobs:
  build-and-test:
    name: "Build & Test"
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Tải source code về máy runner
      - name: "⬇️ Checkout Code"
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Java 17 (Temurin = OpenJDK)
      - name: "☕ Setup Java 17"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Bước 3: Chạy test
      - name: "🧪 Run Unit Tests"
        run: mvn -B test --file pom.xml

      # Bước 4: Build JAR
      - name: "🔨 Build JAR"
        run: mvn -B package -DskipTests --file pom.xml

      # Bước 5: Upload artifact để tải về
      - name: "📦 Upload JAR Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: user-service-jar
          path: target/user-service.jar
