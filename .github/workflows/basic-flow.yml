name: Java Spring boot CI (Basic)
on:
  push:
#    Lắng nghe khi code đc push lên 2 nhánh này thí sẽ kích hoạt các jobs bên dưới
    branches: ["master","main"]
  pull_request:
#    Merge code vào nhánh khác
    branches: ["master","main"]

# Các cng việc cần thực hiện
jobs:
  build-and-test:
    name: "Xây dựng và kiểm thử dự án spring boot"
    runs-on: ubuntu-latest
    # Các bước để chạy job này
    steps:
      # Bước 1 tải code về máy ảo runner
      - name: "Checkout code về máy ảo Runner"
        uses: actions/checkout@v4

      # Bước 2 cài môi tường JDK 17
      - name: "Cài đặt JDK 17"
        uses: actions/setup-java@v4
        with:
          cache: 'maven'
          java-version: '17'
          distribution: 'temurin'
      # Bước 3: Chạy kểm thử
      - name: "Chạy Unit Test"
        run: mvn -B test --file pom.xml
      # bước 4: đóng gói Jar
      - name: "Đóng gói thành file Jar"
        run: mvn -B package -DskipTests --file pom.xml

      # Bước 5: upload file đã đóng gói để tải về
      - name: "Upload file tải về"
        uses: actions/upload-artifact@v4
        with:
          name: 'user-service-jar'
          path: target/user-service.jar

