name: CI/CD Pipeline - User Service

on:
  push:
    branches: [ "main", "develop" ]
    tags:     [ "v*.*.*" ]         # Kích hoạt khi push tag: v1.0.0, v2.1.3...
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ============================================================
# JOB 1: CI - Biên dịch, Kiểm thử, Phân tích chất lượng code
# ============================================================
jobs:
  ci:
    name: "Build & Test"
    runs-on: ubuntu-latest

    steps:
      - name: "⬇️ Checkout source code"
        uses: actions/checkout@v4

      - name: "☕ Setup JDK 17 với Maven Cache"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'   # Tự động cache ~/.m2/repository - tiết kiệm 2-4 phút mỗi lần build!

      - name: "🔨 Biên dịch và Chạy Unit Tests"
        run: mvn -B clean test --file pom.xml

      - name: "📋 Lưu trữ Test Reports (kể cả khi test fail)"
        uses: actions/upload-artifact@v4
        if: always()   # Luôn chạy bước này để xem được báo cáo test khi debug
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: "📦 Đóng gói tệp JAR (bỏ qua chạy test lần 2)"
        run: mvn -B package -DskipTests --file pom.xml

      - name: "💾 Lưu trữ tệp JAR cho các Job sau"
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/user-service.jar
          retention-days: 1

  # ============================================================
  # JOB 2: CD - Build Docker Image & Push lên GHCR
  # Chỉ chạy khi: (1) Job CI thành công VÀ (2) Là sự kiện Push
  # ============================================================
  docker-publish:
    name: "Docker Build & Push"
    runs-on: ubuntu-latest
    needs: ci                                # Phụ thuộc và chờ Job CI hoàn thành
    if: github.event_name == 'push'          # Chỉ Push (không chạy khi là Pull Request)

    permissions:
      contents: read
      packages: write    # Cần quyền ghi để push lên GitHub Packages (GHCR)

    steps:
      - name: "⬇️ Checkout source code"
        uses: actions/checkout@v4

      - name: "🔧 Setup Docker Buildx (hỗ trợ multi-platform & cache)"
        uses: docker/setup-buildx-action@v3

      - name: "🔐 Đăng nhập vào GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Token tự động, an toàn tuyệt đối!

      - name: "🏷️ Tự động tạo Tags và Labels cho Docker Image"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch              # Tag theo tên nhánh: main, develop
            type=semver,pattern={{version}}    # Tag theo SemVer: 1.0.0
            type=semver,pattern={{major}}.{{minor}}   # Tag major.minor: 1.0
            type=sha,prefix=sha-               # Tag theo Git commit SHA: sha-a1b2c3d

      - name: "🐳 Build Docker Image (Multi-stage) và Push lên GHCR"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha          # Tận dụng GitHub Actions Cache cho Docker layers
          cache-to: type=gha,mode=max   # Lưu cache để lần build sau dùng lại
