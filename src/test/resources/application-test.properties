# =========================================================
# application-test.properties
# Cấu hình riêng cho môi trường TEST (Spring Profile: test)
# =========================================================

# Dùng H2 memory database nhưng tên database riêng để test không ảnh hưởng nhau
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Tắt H2 Console khi chạy test
spring.h2.console.enabled=false

# Giảm log khi test để giảm output console
logging.level.com.devops.demo=WARN
logging.level.org.springframework=WARN
